# Base configuration. Every experiment includes this and overrides a few keys.
# Nothing here is a hidden default: modules raise if a key they need is absent.

seed: 0

data:
  # Sequence store built by: python -m metabonet_forecasting.data.prepare
  store: artifacts/store/main

  context: 288                 # lattice steps of history (5 min each): 288 = 24 h
  # Train and score all four. 30/60/120 are the paper's primary horizons; 90 is
  # carried because the public benchmark scores it, and a horizon that is not in
  # this list is never trained, never predicted and never scored -- the store
  # holds its targets, but nothing reads them. One extra horizon costs one output
  # unit and no extra data, so there is no reason to leave it out.
  horizons_min: [30, 60, 90, 120]
  modalities: [cgm, insulin, carbs]

  use_event_features: true     # decay kernels + time-since-event (ablation D10)
  use_masks: true              # per-variable observation masks (ablation D11)
  use_static: true
  use_source_identity: false   # cohort id as a static: shortcut risk, off by default
  use_time_features: true
  missing_policy: zero         # zero | ffill | learned
  # delta | absolute | log_ratio | log
  #
  # `delta` (the benchmark default) predicts the change from the last reading;
  # a zero-initialised head therefore starts at persistence.
  #
  # `log_ratio` predicts log(y / cgm_now) and is the COMPETITION-aligned choice.
  # DTS zone A is exactly 0.8*y <= p <= 1.2*y, i.e. +/-20% RELATIVE error, so in
  # log space it is a constant-width band on the raw model output: an ordinary
  # absolute-error loss here IS a relative-error loss in mg/dL. Under `delta` a
  # 20 mg/dL miss is a zone-B failure at a true 80 and a comfortable zone-A pass
  # at a true 300, and the loss cannot tell them apart. `log_ratio` also keeps
  # the persistence initialisation, because a zero output maps to ~cgm_now.
  #
  # Numbers from a log-space run are NOT comparable with a delta run's; treat it
  # as a separate arm, not a tweak.
  target_mode: delta

  # Planned future actions. EMPTY IS THE BENCHMARK -- leave it empty.
  #
  # Adding "insulin" and/or "carbs" lets the model read those channels from after
  # the anchor. That answers a different question ("given this dose, what
  # happens?") and its numbers are not comparable with any causal run. In this
  # corpus 85.8% of rows are closed-loop, where insulin at t+k is computed by an
  # algorithm from the CGM at t+k, so future insulin is largely the label in
  # disguise. Enable it only to measure that effect, never for a headline result.
  future_modalities: []        # [] | [insulin] | [carbs] | [insulin, carbs]
  future_steps: null           # null = out to the longest horizon

  split:
    scheme: official           # official | subject_kfold | loso | all
                               # all = FINAL MODEL: train on every patient but a
                               # subject-disjoint val_frac slice (val == test).
    val_frac: 0.12
    seed: 0
    val_exclude: []            # scheme=all only: cohorts never drawn into val

  # Second evaluation set. The annual competition holdout is not a random slice
  # of this corpus: all 90 of its patients are on a Dexcom G6 with the iLet
  # Bionic Pancreas (AID), with no carbohydrate and no activity logging, median
  # age 17. Exactly one source dataset here matches that -- IOBP2 -- so the
  # internal holdout is IOBP2 patients, sampled to the annual age distribution
  # and held out whole.
  #
  # Holdout patients are removed from train AND val before the standardizer is
  # fitted, so the model never sees a single window of theirs; splits.py raises
  # if that is ever violated. The selection is frozen in `path` on first use and
  # reused by every later run, so runs stay comparable. Cost: ~89 of the 1,907
  # patients leave the training pool.
  internal_holdout:
    enabled: true
    n_subjects: 89
    source: IOBP2
    # true (default): drop EVERY IOBP2 patient from train and val, not only the
    # 89 that get scored. Without this the model still trains on the other 243
    # patients of the same trial -- same sensor, same pump, same protocol -- and
    # the holdout answers the easy question "a new patient from a study I know"
    # rather than "a patient from a study I have never seen". Costs ~615,000
    # further training anchors. splits.assert_source_unseen enforces it.
    exclude_whole_source: true
    allow_test_subjects: false   # keep the official test split byte-identical
    max_anchors_per_subject: null  # null = score every anchor these patients have
    path: data/internal_holdout.parquet
    refresh: false               # true = re-draw and overwrite the frozen set
    seed: 0

  # Engineered per-anchor features, built by
  # `python -m metabonet_forecasting.features.build`. OFF by default: this repo's
  # own Experiment B measured the cost of deleting all ELEVEN engineered
  # pharmacology channels at -0.37 / -0.26 / -0.22 DTS-A@60 for Mamba-2 / TCN /
  # PatchTST against seed noise of 0.34 / 0.18 / 0.06, so 0 -> 11 features bought
  # about 0.3 points, at the noise floor. A sequence model over the raw lattice
  # computes rolling statistics in its own hidden state; a tabular model cannot,
  # which is why a GBM competitor needs hundreds of them and this does not. On by
  # config only, as a falsification test.
  features:
    enabled: false
    path: null               # a directory written by features.build
    families: all            # all | tier1 | comma-separated family names.
                             # Selects COLUMNS from the built matrix, so a
                             # leave-one-family-out ablation needs no rebuild.
  sampling:
    train_stride: 1            # extra thinning on top of the store's anchor stride
    max_train_windows: 2000000
    max_val_windows: 150000
    max_test_windows: 400000
    max_holdout_windows: null    # null = the whole internal holdout
    standardizer_sample: 200000
    seed: 0

  loader:
    batch_size: 256
    num_workers: 8
    prefetch_factor: 4
    pin_memory: true
    persistent_workers: true

model:
  d_model: 128
  d_static: 32
  # Width the engineered feature block is projected to before it joins the static
  # conditioning vector. 64 against d_static 32: the block is hundreds of columns
  # wide, so squeezing it to 32 would bottleneck the very thing under test, while
  # letting it dwarf d_model would make the arm a capacity change too.
  d_feat: 64
  feat_hidden: null          # null = max(2*d_feat, 128)
  d_time: 16
  static_emb_dim: 8
  encoder:
    dropout: 0.1
    cgm_differences: false
    driver_kernel: 3
    missing_embedding: false
    # Swap the convolutional CGM encoder for a CGM foundation model. The rest of
    # the pipeline (fusion, backbone, horizon_cross head, loss) is untouched, so
    # a score difference is a difference in CGM representation and nothing else.
    #   default     two causal convolutions -- the incumbent
    #   cgm_jepa    CGM-JEPA, published MIT weights (arXiv:2605.00933)
    #   x_cgm_jepa  the cross-view variant of the same release
    #   glucofm     GlucoFM dual-stream architecture (arXiv:2605.30865). NO
    #               public checkpoint exists; weights: must point at one of ours
    #               or this is an architecture test, not a foundation model.
    cgm_encoder: default
    fm:
      mode: hybrid           # hybrid = keep the convolutions and gate the FM in
      freeze: null           # null = per-model default (JEPA frozen, GlucoFM trained)
      use_time: false        # fusion already carries time-of-day; see fm_encoders.py
      input_norm: instance   # mask-aware per-window z-score
      weights: null          # null = artifacts/fm_weights for JEPA; required for GlucoFM
  fusion:
    name: film                 # raw_concat | concat | gated | film
    dropout: 0.1
  backbone:
    name: tcn
  head:
    name: pooled             # pooled | horizon_cross
    pooling: last_mean
    dropout: 0.1
    quantiles: null          # e.g. [0.05,0.1,0.25,0.5,0.75,0.9,0.95]; null = point only
    chain: none              # none|causal|full|cumulative|causal_cum|value|dist
    # The PREDICTIVE LAW the head emits, as distinct from `chain: dist` above,
    # which is about what passes between horizons.
    #
    # `student_t` makes the head emit (decision, mu, log sigma, log nu) per
    # horizon instead of a quantile ladder, which is what lets
    # training.loss.name=zone_t optimise the EXACT expected zone A: the metric is
    # a 0/1 indicator with no gradient, but its expectation under a t is a closed
    # form. The t is not arbitrary -- fitted to this project's own pooled
    # log-residual it reproduces the observed zone-A rate to 0.27-1.17 points at
    # every horizon, where a Gaussian is wrong by up to 8.71, fourteen times the
    # run-to-run noise floor (scripts/analysis/_objective_probe.py).
    #
    # k > 1 is the mixture, and it is the defensible form of "separate models for
    # hypo / hyper / mid": components specialise on a shared backbone without any
    # of them ever losing the middle band, which is 71% of anchors and 63% of all
    # lost points. It also breaks the symmetric-unimodal result that makes the
    # zone-A-optimal point just "median + a constant" -- a multimodal law is the
    # one case where a per-anchor decision can beat a global multiplier.
    law:
      name: none             # none | student_t
      k: 1                   # mixture components
      sigma_init: 0.4        # measured sigma/target_scale: 0.353/0.378/0.394/0.415
      nu_init: 3.0           # measured fitted nu: 2.50/2.89/3.24/3.67 by horizon
      nu_min: 2.05           # below 2 the variance is undefined
      nu_max: 30.0           # a t at nu=30 is a Gaussian; no reason to go there
      mu_spread: 0.5         # k>1: component offsets, in band half-widths. Symmetric
                             # about 0, so the mixture median is still 0 at init
                             # (persistence) while the components are distinct --
                             # identical components would get identical gradients
                             # forever.
      quad_nodes: 32         # Gauss-Legendre nodes for the t CDF. 32 gives 2.0e-8
                             # relative error vs scipy; see common/studentt.py.

training:
  device: cuda
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.95]
  grad_clip: 1.0
  accumulate_grad_batches: 1
  amp: true
  patience: 5                  # epochs without a *significant* gain before stopping
  # What best.pt is selected on. val_rmse is what every historical run used, but
  # it is the WRONG criterion for an arm whose loss deliberately trades RMSE for
  # zone A, and until this key existed every such experiment was confounded by it.
  # Validation zone A is computed and written to train_log.csv either way.
  # Continue from last.pt when the run directory already has one. Default ON:
  # what this guards against is a multi-day run being killed, and last.pt carries
  # the optimiser, the LR schedule position, the AMP scaler and the early-stopping
  # counters -- restarting from best.pt alone would reset the cosine schedule to
  # step 0 and lose the optimiser moments, which is a different experiment rather
  # than a continuation. A fingerprint over the data/model/loss config is stored
  # with it, and a mismatch raises instead of silently continuing another run.
  resume: true
  # Resume points INSIDE an epoch, as fractions of it: e.g. [0.25, 0.5, 0.75]
  # rewrites last.pt (exactly resumable -- the train order is a seeded
  # permutation) and keeps the weights as ckpt/epEE_qK.pt, plus ckpt/epEE_end.pt.
  # [] = epoch-end only, as every run before 2026-09-24.
  checkpoint_fractions: []
  # Stop the run once this many batches in ONE epoch had a non-finite loss.
  # Skipped batches are not random: in the Mamba runs they were the hypo-heavy
  # windows (7-23% of batches), so skipping silently skews what is learned.
  # null = old behaviour (skip and count forever).
  max_nonfinite_batches: null
  select_metric: val_rmse      # val_rmse | val_zone_a
  min_delta: 0.0               # a gain that counts, IN THE UNITS OF select_metric:
                               # mg/dL of val RMSE, or percentage points of zone A.
                               # 0.0 = any improvement resets patience. NOTE 0.02 is
                               # a sensible stinginess in mg/dL and an absurd one in
                               # zone-A points (3% of the 0.6 noise floor);
                               # EXPERIMENT_LEDGER.md sec.4 traces a +1.68 result
                               # that evaporated to +0.25 to this setting stopping
                               # two IDENTICAL configs at 7 and 15 epochs.
  # Exponential moving average of the weights. The remaining error here is SPREAD,
  # not bias -- at h=120 the sd of log(pred/true) is 0.2068 against a pass window of
  # +/-0.2027, so one sd IS the pass mark. Ensembling is the one intervention that
  # reliably reduces spread (+0.5, reproduced every time) and weight averaging is
  # its free approximation. Conditions favour it: several shipped runs never
  # converged (all four c96 runs ended their final epoch on *best*).
  ema:
    enabled: false
    decay: 0.999               # per OPTIMISER STEP; at ~1,245 steps/epoch on the
                               # mini-corpus that is roughly a 0.8-epoch horizon
    start_epoch: 1
    eval_both: true            # score raw and averaged each epoch and checkpoint
                               # the better -- costs ~6% wall and cannot lose.
                               # false trusts the average instead (one eval, not
                               # two); it never means "average, then ignore it".
  warmup_steps: 500
  min_lr_frac: 0.05
  deterministic: false
  log_every: 500
  loss:
    # Per-horizon weights, in the order of data.horizons_min. Honoured by every
    # loss (huber, mse, mae, quantile, hybrid). The scorer pools all four
    # horizons, but 30 min already sits near its ceiling (~92% zone A) while
    # 120 min has several times the headroom (~72%), so an unweighted loss
    # under-invests in the horizon that decides the result. null = equal.
    horizon_weights: null      # e.g. [1.0, 1.0, 1.5, 2.0]
    # huber | mse | mae | quantile | hybrid | welsch | tukey | zone_t
    #
    # Zone A is BOUNDED: once a prediction leaves the band, being further out
    # costs the metric nothing, but a squared or linear loss keeps paying
    # attention in proportion to the error. Share of gradient landing on anchors
    # already outside zone A at h=120 (scripts/analysis/_objective_probe.py):
    #
    #   squared error 65.6%   huber delta=1  62.4%   huber delta=0.5  51.2%
    #   welsch 1.0R   33.5%   tukey 2.0R     24.3%
    #
    # `ox_half` (delta 0.5) is the only loss change that ever beat the noise floor
    # (+0.28) and it sits in the MIDDLE of that ladder, which is why the
    # redescending losses exist. The objection that a bounded loss abandons hard
    # cases is answered by the distances: at h=120, 46% of failing anchors are
    # within half a band-width of passing and only 8.4% are beyond two.
    name: huber
    delta: 1.0
    alpha: 1.0                 # quantile/hybrid: weight on the pinball term.
                               # Measured: 1.0 vs 0.5 is -0.031, i.e. nothing.
    quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
    move_weight: 0.0           # upweight fast-moving anchors. MEASURED NEGATIVE:
                               # -0.71 at 0.5, -1.83 at 1.5. It buys the 25% tails
                               # by selling the 42% flat middle. Closed.
    # Zone A is |log(p/y) - CENTRE| <= HALFWIDTH with CENTRE = -0.020411: the band
    # is NOT centred on zero (you may be 22.3% low but only 18.2% high). For any
    # symmetric unimodal predictive law the zone-A-optimal point is therefore the
    # conditional log-median plus CENTRE, independent of the spread -- confirmed to
    # 0.001-0.004 in multiplier units against a grid search. band_offset puts that
    # constant into training rather than correcting for it afterwards, which
    # matters because the post-hoc fit does NOT transfer: +0.225 on test, -0.106 on
    # the 89 unseen holdout patients, where the model's bias flips sign.
    band_offset: false
    bandwidth: 1.0             # welsch/tukey: bandwidth as a MULTIPLE of the
                               # zone-A half-width in model space, so the knob
                               # means the same thing at every horizon.
    # --- training.loss.name=zone_t only ------------------------------------
    nll_weight: 1.0            # LOAD-BEARING. The band term alone drives sigma->0
                               # where the model is right and sigma->|residual|
                               # where it is wrong, destroying the quantile ladder
                               # submission/decide.py consumes. 0 = diagnostic only.
    zone_obj: prob             # prob (1-P) | logprob (-log P). NOT logprob by
                               # default: -log P grows like nu*log|e| so its
                               # gradient decays only as 1/|e| and it spends 59.4%
                               # of its gradient on already-lost anchors -- worse
                               # than plain Huber's 51.2%. 1-P spends 36.3%.
    zone_obj_weight: 1.0
    point_weight: 0.0          # optional Huber on the decision output
    sharpness_weight: 0.0      # penalty on log sigma: the explicit
                               # sharpness-vs-calibration trade, with one
                               # interpretable coefficient instead of hoping
                               # weight decay does it indirectly.
    quad_nodes: 32
    # --- the sigmoid stand-in, superseded by zone_t ------------------------
    zone_weight: 0.0           # blend in sigmoid((R-|resid|)/tau). MEASURED AT
                               # NOISE: +0.01 / +0.10 / -0.09 over a tau ladder,
                               # flat rather than monotone, which is also the
                               # answer about a policy gradient -- it reaches the
                               # same objective the surrogate already reaches.
    zone_tau: 0.15
