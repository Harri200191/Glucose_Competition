# Points every experiment at the small store and shrinks everything so a full
# train -> predict -> score cycle finishes in a couple of minutes on one GPU.
# Used by scripts/02_smoke_test.sh; never report numbers from it.
data:
  store: artifacts/store/smoke
  context: 96
  # The smoke store holds no IOBP2 patients, so the internal holdout borrows the
  # nearest match it does have (AZT1D: Dexcom G6, AID) purely to exercise the
  # code path. AZT1D has no under-18s, so the age match falls short and the
  # shortfall redistribution runs -- which is the branch worth smoke-testing.
  internal_holdout:
    source: AZT1D
    n_subjects: 5
    path: artifacts/store/smoke/internal_holdout_smoke.parquet
  sampling:
    max_train_windows: 20000
    max_val_windows: 4000
    max_test_windows: 8000
    standardizer_sample: 20000
  loader:
    batch_size: 64
    num_workers: 2
    prefetch_factor: 2

training:
  epochs: 2
  patience: 2
  warmup_steps: 20
  max_steps_per_epoch: 60
  log_every: 20
